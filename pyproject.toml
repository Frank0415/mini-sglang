[project]
name = "mini-sglang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuzhao Shi", email = "frank20050415@sjtu.edu.cn" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "torch==2.14.0",
    "triton",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
