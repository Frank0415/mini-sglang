[project]
name = "mini-sglang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuzhao Shi", email = "frank20050415@sjtu.edu.cn" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "torch==2.14.0",
    "transformers>=5.17.0",
    "triton",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "mini_sglang",
    "mini_sglang.configs",
    "mini_sglang.layers",
    "mini_sglang.layers.attention",
    "mini_sglang.mem_cache",
    "mini_sglang.model_executor",
    "mini_sglang.model_loader",
    "mini_sglang.models",
    "mini_sglang.scheduler",
    "mini_sglang.tokenizer",
]

[tool.setuptools.package-dir]
mini_sglang = "src"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
